<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tonalfreqs.io - Document Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0e0e0e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            overflow-y: auto;
            padding: 1rem;
        }

        #sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        #sidebar h3 {
            font-size: 0.9rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .doc-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: #252525;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .doc-item:hover {
            background: #333;
        }

        .doc-item.active {
            background: #2a5599;
        }

        .doc-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .doc-desc {
            font-size: 0.75rem;
            color: #999;
            line-height: 1.3;
        }

        .doc-tags {
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .doc-tag {
            font-size: 0.65rem;
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #bbb;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #333;
            background: #161616;
        }

        #header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        #header p {
            font-size: 0.85rem;
            color: #999;
        }

        #viewer {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #131313;
        }

        #loading {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #2a5599;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #331a1a;
            border: 1px solid #663333;
            border-radius: 6px;
            padding: 1rem;
            color: #ff6666;
        }

        .series-indicator {
            font-size: 0.7rem;
            background: #2a5599;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 0.25rem;
        }

        #filter-section {
            margin-bottom: 1rem;
        }

        #search-input {
            width: 100%;
            padding: 0.5rem;
            background: #252525;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
        }

        #search-input:focus {
            outline: none;
            border-color: #2a5599;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h2>tonalfreqs.io</h2>
            <div id="filter-section">
                <input type="text" id="search-input" placeholder="Search documents...">
            </div>
            <div id="categories"></div>
        </div>
        <div id="main">
            <div id="header">
                <h1>Document Repository</h1>
                <p>Browse and view music theory, notation, and AI documentation</p>
            </div>
            <div id="viewer">
                <div id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading document...</p>
                </div>
                <div id="content">
                    <p style="color: #999; text-align: center; padding: 3rem;">
                        Select a document from the sidebar to view
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { DocumentLoader, DocumentFactory } from './integration/document-loader.js';

        class DocumentViewerApp {
            constructor() {
                this.loader = new DocumentLoader();
                this.currentDoc = null;
                this.allDocuments = [];
                this.init();
            }

            async init() {
                try {
                    const manifest = await this.loader.loadManifest();
                    this.allDocuments = manifest.documents;
                    this.renderCategories(manifest);
                    this.setupSearch();
                } catch (error) {
                    console.error('Failed to initialize app:', error);
                    this.showError('Failed to load document manifest');
                }
            }

            renderCategories(manifest) {
                const container = document.getElementById('categories');
                
                // Group documents by category
                const grouped = {};
                manifest.documents.forEach(doc => {
                    if (!grouped[doc.category]) {
                        grouped[doc.category] = [];
                    }
                    grouped[doc.category].push(doc);
                });

                // Render each category
                manifest.categories.forEach(category => {
                    const docs = grouped[category.id] || [];
                    if (docs.length === 0) return;

                    const categoryDiv = document.createElement('div');
                    
                    const header = document.createElement('h3');
                    header.textContent = category.name;
                    categoryDiv.appendChild(header);

                    docs.forEach(doc => {
                        const docDiv = this.createDocumentItem(doc);
                        categoryDiv.appendChild(docDiv);
                    });

                    container.appendChild(categoryDiv);
                });
            }

            createDocumentItem(doc) {
                const docDiv = document.createElement('div');
                docDiv.className = 'doc-item';
                docDiv.dataset.id = doc.id;

                let content = '';

                if (doc.series) {
                    content += `<div class="series-indicator">Part ${doc.series.part} of ${doc.series.totalParts}</div>`;
                }

                content += `
                    <div class="doc-title">${doc.title}</div>
                    <div class="doc-desc">${doc.description}</div>
                `;

                if (doc.tags && doc.tags.length > 0) {
                    content += '<div class="doc-tags">';
                    doc.tags.slice(0, 3).forEach(tag => {
                        content += `<span class="doc-tag">${tag}</span>`;
                    });
                    content += '</div>';
                }

                docDiv.innerHTML = content;

                docDiv.addEventListener('click', () => {
                    this.loadDocument(doc.id);
                    
                    // Update active state
                    document.querySelectorAll('.doc-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    docDiv.classList.add('active');
                });

                return docDiv;
            }

            setupSearch() {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    this.filterDocuments(query);
                });
            }

            filterDocuments(query) {
                const items = document.querySelectorAll('.doc-item');
                items.forEach(item => {
                    const text = item.textContent.toLowerCase();
                    if (text.includes(query)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            async loadDocument(documentId) {
                const loading = document.getElementById('loading');
                const content = document.getElementById('content');
                const header = document.getElementById('header');

                // Show loading state
                loading.style.display = 'block';
                content.innerHTML = '';

                try {
                    // Cleanup previous document
                    if (this.currentDoc && this.currentDoc.cleanup) {
                        this.currentDoc.cleanup();
                    }

                    // Load new document
                    const metadata = await this.loader.getDocumentMetadata(documentId);
                    
                    // Update header
                    header.querySelector('h1').textContent = metadata.title;
                    header.querySelector('p').textContent = metadata.description;

                    // Load and render
                    this.currentDoc = await DocumentFactory.loadAndRender(documentId, content);

                    loading.style.display = 'none';
                } catch (error) {
                    console.error('Failed to load document:', error);
                    loading.style.display = 'none';
                    this.showError(`Failed to load document: ${error.message}`);
                }
            }

            showError(message) {
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div class="error">
                        <strong>Error</strong><br>
                        ${message}
                    </div>
                `;
            }
        }

        // Initialize app
        const app = new DocumentViewerApp();
    </script>
</body>
</html>
